# Memoh runtime отдельным compose-проектом (другой name/network, не трогает Studio).
#
# export MEMOH_ROOT=/opt/pb-studio/memoh
# cd /path/to/pb-memoh-studio
# docker compose -f deploy/docker-compose.memoh.yml up -d
#
# Подготовка каталога и env: python3 deploy/scripts/prepare_memoh_runtime.py ...

name: memoh-jar

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memoh
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: memoh123
    volumes:
      - memoh_pg_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memoh-internal

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memoh-internal

  migrate:
    # Сборка из этого репо — включает Event Mirror (internal/channel/adapters/telegram/studio_event_mirror.go).
    # На VPS: из корня репо с заданным MEMOH_ROOT: docker compose -f deploy/docker-compose.memoh.yml build server && docker compose ... up -d
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: pb-memoh-server:jar
    entrypoint: ["/app/memoh-server", "migrate", "up"]
    volumes:
      - ${MEMOH_ROOT}/config.toml:/app/config.toml:ro
      - memoh_data:/opt/memoh/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    env_file:
      - ${MEMOH_ROOT}/.env.memoh
    networks:
      - memoh-internal

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: pb-memoh-server:jar
    privileged: true
    pid: host
    volumes:
      - ${MEMOH_ROOT}/config.toml:/app/config.toml:ro
      - ${MEMOH_ROOT}/providers:/app/conf/providers:ro
      - containerd_data:/var/lib/containerd
      - server_cni_state:/var/lib/cni
      - memoh_data:/opt/memoh/data
      - /etc/cdi:/etc/cdi:ro
      - /var/run/cdi:/var/run/cdi:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1455:8080"
      - "${MEMOH_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}-${MEMOH_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}:${MEMOH_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}-${MEMOH_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}/udp"
    environment:
      MEMOH_DISPLAY_WEBRTC_UDP_PORT_MIN: "${MEMOH_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}"
      MEMOH_DISPLAY_WEBRTC_UDP_PORT_MAX: "${MEMOH_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ${MEMOH_ROOT}/.env.memoh
    networks:
      memoh-internal:
        aliases:
          - memoh-server

  web:
    image: memohai/web:latest
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - memoh-internal

volumes:
  memoh_pg_data:
    driver: local
  memoh_data:
    driver: local
  server_cni_state:
    driver: local
  containerd_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  memoh-internal:
    driver: bridge
