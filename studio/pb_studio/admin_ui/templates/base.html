<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Studio Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
<div class="d-flex min-vh-100">
  <aside class="border-end bg-white p-3" style="width: 220px; min-width: 220px;">
    <div class="fw-semibold mb-3 text-secondary small">pb-studio</div>
    <nav class="nav flex-column small gap-1">
      <a class="nav-link py-1 rounded{% if nav_active == 'dashboard' %} active bg-primary-subtle{% endif %}" href="/admin/">Обзор</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'chats' %} active bg-primary-subtle{% endif %}" href="/admin/chats">Чаты</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'cg' %} active bg-primary-subtle{% endif %}" href="/admin/control-group">Control group</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'summaries' %} active bg-primary-subtle{% endif %}" href="/admin/summaries">Сводки</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'projects' %} active bg-primary-subtle{% endif %}" href="/admin/projects">Проекты</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'sla' %} active bg-primary-subtle{% endif %}" href="/admin/sla/incidents">SLA инциденты</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'kb' %} active bg-primary-subtle{% endif %}" href="/admin/knowledge/documents">KB документы</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'rules' %} active bg-primary-subtle{% endif %}" href="/admin/assistant-rules">Правила</a>
      <a class="nav-link py-1 rounded{% if nav_active == 'hist' %} active bg-primary-subtle{% endif %}" href="/admin/history-import/jobs">Импорт истории</a>
    </nav>
    <hr>
    <form method="post" action="/admin/logout" class="d-grid">
      <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
    </form>
    <div class="text-muted mt-3" style="font-size: 0.7rem;">read-only · 13a</div>
  </aside>
  <main class="flex-grow-1 p-4 overflow-auto">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
