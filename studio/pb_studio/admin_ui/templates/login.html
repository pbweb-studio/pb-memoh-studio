<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Studio Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 420px;">
  <h1 class="h4 mb-4">Studio Admin</h1>
  {% if not_configured %}
  <div class="alert alert-warning">Не задан <code>STUDIO_ADMIN_TOKEN</code> — вход недоступен.</div>
  {% else %}
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login" class="card shadow-sm">
    <div class="card-body">
      <label class="form-label">Токен администратора</label>
      <input type="password" name="admin_token" class="form-control" autocomplete="off" required>
      {% if next_url %}
      <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}
      <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
    </div>
  </form>
  <p class="text-muted small mt-3">Токен не сохраняется в логах сервера. Используйте HTTPS в проде.</p>
  {% endif %}
</div>
</body>
</html>
